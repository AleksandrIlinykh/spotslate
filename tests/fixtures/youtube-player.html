<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SpotSlate YouTube player fixture</title>
  <style>
    body { margin: 0; font: 16px/1.5 sans-serif; }
    #movie_player { position: relative; width: 640px; height: 360px; margin: 40px auto; background: #111; }
    #movie_player video { width: 100%; height: 100%; }
    .ytp-caption-window-container { position: absolute; left: 0; right: 0; bottom: 20px; }
    .caption-window { display: block; text-align: center; }
    .captions-text { display: block; }
    .caption-visual-line { display: block; }
    .ytp-caption-segment { display: inline-block; color: #fff; background: rgba(0, 0, 0, 0.75); font-size: 22px; padding: 2px 6px; }
    /* As on YouTube: the caption cannot be selected, and the pointer over it is a hand that grabs the window. The
       player is held as it is for a moment while its controls come up, when the mouse goes through the caption. */
    .caption-window, .caption-window * { user-select: none; cursor: grab; }
    .ytp-autohide-active .caption-window { pointer-events: none; }
  </style>
</head>
<body>
  <!-- A playing player that reacts to the mouse as YouTube's does, counting each reaction in `seen`. -->
  <div id="movie_player" class="html5-video-player ytp-autohide-active">
    <video></video>
    <div class="ytp-caption-window-container">
      <div class="caption-window ytp-caption-window-bottom">
        <span class="captions-text">
          <span class="caption-visual-line"><span id="seg1" class="ytp-caption-segment">What you have there is a person</span></span>
          <span class="caption-visual-line"><span id="seg2" class="ytp-caption-segment">of extraordinary talent</span></span>
        </span>
      </div>
    </div>
  </div>
  <script>
    // A press on the caption window starts dragging it, a click on the player toggles play, a double click toggles
    // fullscreen and a right click opens the player's own menu.
    const player = document.getElementById('movie_player');
    const video = player.querySelector('video');
    window.seen = { drags: 0, toggles: 0, fullscreens: 0, menus: 0 };
    document.querySelector('.caption-window').addEventListener('mousedown', () => seen.drags++);
    player.addEventListener('click', () => {
      seen.toggles++;
      if (video.paused) video.play();
      else video.pause();
    });
    player.addEventListener('dblclick', () => seen.fullscreens++);
    player.addEventListener('contextmenu', (event) => {
      event.preventDefault();
      seen.menus++;
    });
    // The video plays a canvas stream, so there is no file to load.
    const canvas = document.createElement('canvas');
    canvas.getContext('2d').fillRect(0, 0, 10, 10);
    video.muted = true;
    video.srcObject = canvas.captureStream();
    video.play();
  </script>
</body>
</html>
